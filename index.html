<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oleksandr Basenko | Developer Hub</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #f7f9fa; 
            color: #333; 
        }
        .container { 
            text-align: center; 
            background: white; 
            padding: 50px 40px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            max-width: 450px; 
            width: 100%; 
        }
        h1 { 
            margin: 0 0 10px 0; 
            font-size: 26px; 
            color: #111;
        }
        p { 
            color: #666; 
            margin-bottom: 35px; 
            font-size: 15px;
        }
        a.button { 
            display: inline-block; 
            padding: 14px 28px; 
            background-color: #111; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: 600; 
            transition: all 0.3s ease; 
        }
        a.button:hover { 
            background-color: #333; 
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Oleksandr Basenko</h1>
        <p>Automation Systems & Personal Projects Hub</p>
        
        <!-- Ця кнопка перенаправлятиме модераторів на твій додаток -->
        <a href="/content-publisher/" class="button">Go to ContentPoster System</a>
    </div>
</body>
</html>
