<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oleksandr Basenko | Projects Hub</title>
    <!-- Підтягуємо іконку з іншого репозиторію -->
    <link rel="icon" type="image/png" href="/content-publisher/favicon.png">
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #f7f9fa; 
            color: #333; 
        }
        .container { 
            text-align: center; 
            max-width: 450px; 
            width: 100%; 
            padding: 20px;
        }
        .header-title { 
            margin: 0 0 5px 0; 
            font-size: 26px; 
            color: #111;
        }
        .header-subtitle { 
            color: #666; 
            margin-bottom: 35px; 
            font-size: 15px;
        }
        
        /* Стилі для картки проєкту */
        .project-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #eaeaea;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        .project-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            border-radius: 16px;
            object-fit: cover;
        }
        .project-title {
            margin: 0 0 10px 0;
            font-size: 22px;
            color: #111;
        }
        .project-desc {
            color: #555;
            font-size: 15px;
            line-height: 1.5;
            margin: 0 0 25px 0;
        }
        .button { 
            display: inline-block; 
            padding: 12px 24px; 
            background-color: #111; 
            color: white; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 15px;
            transition: background-color 0.3s ease; 
            width: 100%;
            box-sizing: border-box;
        }
        .button:hover { 
            background-color: #333; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header-title">Oleksandr Basenko</h1>
        <p class="header-subtitle">Developer & Automation Systems Hub</p>
        
        <!-- Картка проєкту -->
        <div class="project-card">
            <!-- Логотип підтягується автоматично -->
            <img src="/content-publisher/logo.png" alt="ContentPoster Logo" class="project-logo">
            
            <h2 class="project-title">ContentPoster</h2>
            <p class="project-desc">Private server-to-server automation system designed for corporate media publishing via Telegram.</p>
            
            <a href="/content-publisher/" class="button">Open Project System</a>
        </div>
    </div>
</body>
</html>
